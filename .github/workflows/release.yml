# Builds the extension zip and publishes a GitHub release.
# Runs automatically when the version in manifest.json changes on main
# (skipped if that version is already released), from the Actions tab
# ("Run workflow"), or when a tag like v1.0.1 is pushed.
name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [manifest.json, .github/workflows/release.yml]
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from manifest
        id: version
        run: |
          TAG="v$(jq -r .version manifest.json)"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest.json version $TAG"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG is already released, nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build zip
        if: steps.version.outputs.exists != 'true'
        run: |
          mkdir -p dist/crawlvault
          cp -r manifest.json background.js content dashboard icons lib popup LICENSE dist/crawlvault/
          cd dist && zip -r "crawlvault-${{ steps.version.outputs.tag }}.zip" crawlvault

      - name: Publish release
        if: steps.version.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: CrawlVault ${{ steps.version.outputs.tag }}
          files: dist/crawlvault-${{ steps.version.outputs.tag }}.zip
          generate_release_notes: true
          body: |
            **Install:** download `crawlvault-${{ steps.version.outputs.tag }}.zip` below, unzip it, open `chrome://extensions`, turn on Developer mode, click **Load unpacked** and select the `crawlvault` folder.
